<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__BOARD_TITLE__</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">📚</div>
        <div>
          <div class="sidebar-title">study-kanban</div>
          <div class="sidebar-subtitle">学习看板</div>
        </div>
      </div>

      <div class="menu-group">
        <div class="menu-group-title">看板信息</div>
        <div class="info-card">
          <div class="info-card-title" id="sidebar-board-title">__BOARD_TITLE__</div>
          <div class="info-card-meta" id="sidebar-board-meta">加载中…</div>
        </div>
      </div>

      <div class="menu-group">
        <div class="menu-group-title">操作</div>
        <button class="menu-item" id="back-to-top">↑ 返回顶部</button>
        <button class="menu-item" id="sidebar-reset">↺ 重置进度</button>
      </div>

      <button class="collapse-btn" id="collapse-btn" title="折叠/展开侧边栏">‹</button>
    </aside>

    <!-- 主区域 -->
    <main class="main-area">
      <header class="header">
        <div class="header-left">
          <h1>__BOARD_TITLE__</h1>
          <p>__BOARD_SUBTITLE__</p>
        </div>

        <div class="header-right">
          <div class="progress-circle" id="progress-circle">
            <div class="progress-inner">
              <span class="progress-text" id="progress-text">0%</span>
              <span class="progress-detail" id="progress-detail">0 / 0</span>
            </div>
          </div>
          <div class="progress-label">整体进度</div>
        </div>
      </header>

      <div class="legend">
        <span class="legend-item"><span class="legend-dot tag-reading"></span>阅读理解</span>
        <span class="legend-item"><span class="legend-dot tag-hands-on"></span>动手实操</span>
        <span class="legend-item"><span class="legend-dot tag-practice"></span>练习巩固</span>
        <span class="legend-item"><span class="legend-dot tag-mastery"></span>综合应用</span>
      </div>

      <div class="toolbar">
        <div class="stage-buttons" id="stage-buttons"></div>
        <div class="toolbar-actions">
          <button class="action-btn" id="select-all">✓ 一键全部完成</button>
          <button class="action-btn reset" id="reset-all">↺ 重置进度</button>
        </div>
      </div>

      <div class="board" id="board"></div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
