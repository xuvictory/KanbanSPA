<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Server 学习路线</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">📚</div>
        <div>
          <div class="sidebar-title">爱学习</div>
        </div>
      </div>

      <!-- 动态主题菜单区（由 app.js 根据 boards 渲染）：多个学习主题 → 多个一级菜单，
           每个一级菜单下挂该主题的知识点子菜单（按阶段分组）。单主题时只渲染一个菜单。 -->
      <div id="menuGroupsContainer"></div>

      <div class="menu-group">
        <div class="menu-group-title">操作</div>
        <button class="menu-item" id="back-to-top">↑ 返回顶部</button>
        <button class="menu-item" id="sidebar-reset">↺ 重置进度</button>
      </div>

      <button class="collapse-btn" id="collapse-btn" title="折叠/展开侧边栏">‹</button>
    </aside>

    <!-- 主区域 -->
    <main class="main-area">
      <header class="header">
        <div class="header-left">
          <h1>SQL Server 学习路线</h1>
          <p>从入门到精通 · 5 阶段、20 个知识点，零基础也能学会</p>
        </div>

        <div class="progress-section header-right">
          <div class="progress-circle" id="progress-circle">
            <span class="progress-text" id="progress-text">0%</span>
          </div>
          <div class="progress-info">
            <span class="label">总进度</span>
            <span class="value" id="progress-detail">0 / 0 知识点</span>
          </div>
        </div>
      </header>

      <div class="legend">
        <span class="legend-item"><span class="legend-dot reading"></span>阅读理解</span>
        <span class="legend-item"><span class="legend-dot hands-on"></span>动手实操</span>
        <span class="legend-item"><span class="legend-dot practice"></span>练习巩固</span>
        <span class="legend-item"><span class="legend-dot mastery"></span>综合应用</span>
      </div>

      <div class="toolbar">
        <div class="stage-buttons" id="stage-buttons"></div>
        <div class="toolbar-actions">
          <button class="action-btn select-all" id="select-all">✓ 一键全部完成</button>
          <button class="action-btn reset" id="reset-all">↺ 重置进度</button>
        </div>
      </div>

      <div class="boards-container" id="boardsContainer"></div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
